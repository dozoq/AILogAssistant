name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LogAssistant
    env:
      ANTHROPIC_API_KEY: dummy-key-for-ci
      JWT_SECRET_KEY: dummy-key-for-ci
      INTERNAL_CLIENT_SECRET: dummy-key-for-ci
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --cov=src/logassistant --cov-report=term-missing