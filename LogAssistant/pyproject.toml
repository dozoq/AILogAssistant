[project]
name = "logassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebkewmeszke", email = "sebkewmeszke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-qdrant>=1.1.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
logassistant = "logassistant.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
